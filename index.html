
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 500px;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px #3335;
}

h1 {
    color: #6545c5;
    margin-bottom: 20px;
}

.info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    font-weight: bold;
}

#timer {
    color: #e63946;
}

#question {
    font-size: 21px;
    margin: 25px 0;
}

.answers {
    display: grid;
    gap: 12px;
}

button {
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

.answer-btn {
    background: #eee;
    text-align: left;
}

.answer-btn:hover:not(:disabled) {
    background: #dcd5ff;
}

.answer-btn:disabled {
    cursor: not-allowed;
}

.correct {
    background: #4caf50 !important;
    color: white;
}

.wrong {
    background: #e63946 !important;
    color: white;
}

.main-btn {
    background: #6545c5;
    color: white;
    margin-top: 25px;
    width: 100%;
}

.main-btn:hover {
    background: #4b2fa0;
}

#result {
    font-size: 22px;
    margin: 20px 0;
    font-weight: bold;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <h1>🎯 Quiz Game</h1>

    <div id="start-screen">
        <p>Welcome to the Quiz Game!</p>
        <p>Test your knowledge and earn points.</p>
        <button class="main-btn" onclick="startQuiz()">
            Start Quiz
        </button>
    </div>

    <div id="quiz-screen" class="hidden">

        <div class="info">
            <span id="progress">Question 1</span>
            <span>Score: <span id="score">0</span></span>
            <span id="timer">15s</span>
        </div>

        <h2 id="question"></h2>

        <div class="answers" id="answers"></div>

        <button class="main-btn hidden" id="next-btn"
            onclick="nextQuestion()">
            Next Question
        </button>

    </div>

    <div id="result-screen" class="hidden">
        <h2>🏆 Quiz Completed!</h2>
        <p id="result"></p>
        <button class="main-btn" onclick="startQuiz()">
            Play Again
        </button>
    </div>

</div>

<script>

const questions = [
    {
        question: "What is the capital of India?",
        answers: ["Mumbai", "New Delhi", "Pune", "Chennai"],
        correct: 1
    },
    {
        question: "Which planet is known as the Red Planet?",
        answers: ["Earth", "Venus", "Mars", "Jupiter"],
        correct: 2
    },
    {
        question: "How many days are there in a week?",
        answers: ["5", "6", "7", "8"],
        correct: 2
    },
    {
        question: "Which language is used for web styling?",
        answers: ["HTML", "CSS", "Python", "C++"],
        correct: 1
    },
    {
        question: "What is 10 × 5?",
        answers: ["40", "45", "50", "55"],
        correct: 2
    }
];

let currentQuestion = 0;
let score = 0;
let timeLeft = 15;
let timerInterval;
let answered = false;

function startQuiz() {
    currentQuestion = 0;
    score = 0;

    document.getElementById("score").textContent = score;
    document.getElementById("start-screen").classList.add("hidden");
    document.getElementById("result-screen").classList.add("hidden");
    document.getElementById("quiz-screen").classList.remove("hidden");

    showQuestion();
}

function showQuestion() {
    clearInterval(timerInterval);

    answered = false;
    timeLeft = 15;

    const q = questions[currentQuestion];

    document.getElementById("question").textContent = q.question;
    document.getElementById("progress").textContent =
        `Question ${currentQuestion + 1} / ${questions.length}`;

    document.getElementById("timer").textContent = "15s";

    document.getElementById("next-btn").classList.add("hidden");

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.answers.forEach((answer, index) => {
        const button = document.createElement("button");

        button.textContent = answer;
        button.className = "answer-btn";

        button.onclick = () => selectAnswer(index, button);

        answersDiv.appendChild(button);
    });

    timerInterval = setInterval(() => {
        timeLeft--;

        document.getElementById("timer").textContent =
            timeLeft + "s";

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            selectAnswer(-1, null);
        }
    }, 1000);
}

function selectAnswer(index, selectedButton) {
    if (answered) return;

    answered = true;
    clearInterval(timerInterval);

    const correct = questions[currentQuestion].correct;
    const buttons = document.querySelectorAll(".answer-btn");

    buttons.forEach((button, i) => {
        button.disabled = true;

        if (i === correct) {
            button.classList.add("correct");
        }
    });

    if (index === correct) {
        score++;
        document.getElementById("score").textContent = score;
    } else if (selectedButton) {
        selectedButton.classList.add("wrong");
    }

    document.getElementById("next-btn").classList.remove("hidden");
}

function nextQuestion() {
    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    clearInterval(timerInterval);

    document.getElementById("quiz-screen").classList.add("hidden");
    document.getElementById("result-screen").classList.remove("hidden");

    document.getElementById("result").textContent =
        `Your Score: ${score} / ${questions.length}`;
}

</script>

</body>
</html>
